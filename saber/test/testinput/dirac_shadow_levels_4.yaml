geometry:
  function space: StructuredColumns
  grid:
    type: regular_lonlat
    N: 30
  groups:
  - variables:
    - snow_depth
    levels: 1
    vertical coordinate:
      profile: [0.0]
    orography: 
      top longitude: 180.0
      top latitude: 0.0
      zonal length: 6000.0e3
      meridional length: 12000.0e3
      height: 1.0
  - variables:
    - snow_depth_shadowLevels_1
    levels: 17
  - variables:
    - snow_depth_shadowLevels_2
    levels: 12
  halo: 1
background:
  date: 2010-01-01T12:00:00Z
  state variables:
  - snow_depth
background error:
  covariance model: SABER
  saber central block:
    saber block name: BUMP_NICAS
    read:
      general:
        testing: true
        universe length-scale: 10000.0e3
      io:
        data directory: testdata
        files prefix: dirac_shadow_levels_4/_MPI_-_OMP_
        overriding nicas file: dirac_shadow_levels_3/_MPI_-_OMP__nicas
      drivers:
        multivariate strategy: univariate
        read local nicas: true
        adjoints test: true
      nicas:
        same horizontal convolution: true
      grids:
      - model:
          variables: [snow_depth_shadowLevels_1]
      - model:
          variables: [snow_depth_shadowLevels_2]
  saber outer blocks:
  - saber block name: ShadowLevels
    read:
      groups:
      - variables: [snow_depth]
        number of shadow levels: 17
        suffix: _shadowLevels_1
      - variables: [snow_depth]
        number of shadow levels: 12
        suffix: _shadowLevels_2
      input weight file:
        overriding variables: [snow_depth_shadowLevels_1, snow_depth_shadowLevels_2]
        filepath: testdata/dirac_shadow_levels_3/_MPI_-_OMP__weight
dirac:
  lon:
  - 180.0
  lat:
  - 0.0
  level:
  - 1
  variable:
  - snow_depth
output dirac:
  filepath: testdata/dirac_shadow_levels_4/_MPI_-_OMP__dirac_%id%
test:
  reference filename: testref/dirac_shadow_levels_4.ref
